<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>俄罗斯方块</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #12121a; color: #e8e8f0; font-family: system-ui, sans-serif; user-select: none; }
  h1 { font-size: 18px; margin: 10px 0 6px; color: #7ee0ff; }
  .top-btns { display: flex; gap: 10px; margin-bottom: 8px; }
  .top-btns button { padding: 6px 16px; border-radius: 20px; border: none; background: #26263a; color: #fff; cursor: pointer; font-size: 13px; }
  .top-btns button:hover { background: #3aa8ff; }
  .hud { display: flex; gap: 15px; font-size: 14px; margin-bottom: 8px; color: #a0a0b8; }
  .hud b { color: #fff; }
  .hud .best { color: #f0d43a; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 8px; background: #1b1b28; box-shadow: 0 0 0 2px #2e2e44; }
  .controls { margin-top: 14px; display: grid; grid-template-columns: repeat(4, 62px); gap: 10px; justify-content: center; }
  .controls button { height: 52px; border: none; border-radius: 10px; background: #26263a; color: #d8d8ea; font-size: 20px; cursor: pointer; }
  .controls button:active { background: #3aa8ff; color: #fff; }
  .controls .wide { grid-column: span 2; font-size: 14px; }
  .hint { margin-top: 10px; font-size: 11px; color: #66667a; text-align: center; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,18,.85); border-radius: 8px; text-align: center; }
  .overlay h2 { margin: 0 0 10px; font-size: 22px; color: #7ee0ff; }
  .overlay p { margin: 0 0 15px; font-size: 14px; color: #b8b8cc; }
  .overlay button { padding: 10px 25px; border: none; border-radius: 8px; background: #3aa8ff; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; }
  .overlay.hidden { display: none; }
</style>
</head>
<body>
<h1>俄罗斯方块</h1>
<div class="top-btns">
  <button id="musicBtn">🎵 播放音乐</button>
</div>
<div class="hud">
  <span>分数 <b id="score">0</b></span>
  <span>最高 <b id="highScore" class="best">0</b></span>
  <span>行数 <b id="lines">0</b></span>
</div>
<div class="wrap">
  <canvas id="game"></canvas>
  <div class="overlay" id="startScreen">
    <h2>俄罗斯方块</h2>
    <p>点击下方按钮开始</p>
    <button id="startBtn">▶️ 开始游戏</button>
  </div>
</div>
<div class="controls">
  <button data-act="left">←</button>
  <button data-act="rotate">⟳</button>
  <button data-act="right">→</button>
  <button data-act="down">↓</button>
  <button class="wide" data-act="drop">直落</button>
  <button class="wide" data-act="pause">暂停/继续</button>
</div>
<div class="hint">手机：滑动屏幕或点按钮 · 电脑：方向键</div>
<script>
 (function () {
  const COLS = 10, ROWS = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const maxH = Math.min(window.innerHeight * 0.55, 520);
  const block = Math.floor(Math.min((window.innerWidth - 60) / COLS, maxH / ROWS, 34));
  const W = COLS * block, H = ROWS * block;
  canvas.width = W; canvas.height = H;
  
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const linesEl = document.getElementById('lines');
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');

  let highScore = parseInt(localStorage.getItem('tetris_high_score')) || 0;
  highScoreEl.textContent = highScore;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let isMusicPlaying = false;
  let musicTimer;
  const melody = [
    [659, 1], [494, 1], [523, 1], [587, 1], [523, 1], [494, 1], [440, 1], [440, 1], [523, 1], [659, 1], [587, 1], [523, 1], [494, 2], [523, 1], [587, 1], [659, 1], [523, 1], [440, 1], [440, 1], [0, 1],
    [587, 1], [698, 1], [880, 1], [784, 1], [698, 1], [659, 1], [523, 1], [659, 1], [587, 1], [523, 1], [494, 1], [494, 1], [523, 1], [587, 1], [659, 1], [523, 1], [440, 1], [440, 1], [0, 1]
  ];
  let melodyIndex = 0;
  
  function playNote(freq, duration) {
    if (freq === 0) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }
  function playMusic() {
    if (!isMusicPlaying) return;
    const note = melody[melodyIndex];
    if (note[0] > 0) playNote(note[0], note[1] * 0.15);
    melodyIndex = (melodyIndex + 1) % melody.length;
    musicTimer = setTimeout(playMusic, note[1] * 160);
  }
  function toggleMusic() {
    if (isMusicPlaying) { isMusicPlaying = false; clearTimeout(musicTimer); }
    else { if (audioCtx.state === 'suspended') audioCtx.resume(); isMusicPlaying = true; playMusic(); }
  }

  const SHAPES = { I: [[1,1,1,1]], O: [[1,1],[1,1]], T: [[0,1,0],[1,1,1]], S: [[0,1,1],[1,1,0]], Z: [[1,1,0],[0,1,1]], J: [[1,0,0],[1,1,1]], L: [[0,0,1],[1,1,1]] };
  const COLORS = { I: '#38d9d9', O: '#f0d43a', T: '#b26bf0', S: '#4ade80', Z: '#f45b69', J: '#5b8df4', L: '#f59e4b' };
  const KEYS = Object.keys(SHAPES);
  
  let board, cur, next, score, lines, level, dropTimer, dropInterval, running, paused, gameOver;
  function emptyBoard() { return Array.from({ length: ROWS }, () => Array(COLS).fill(null)); }
function newPiece() {
  const type = KEYS[Math.floor(Math.random() * KEYS.length)];
  const shape = SHAPES[type].map(r => r.slice());
  return { type, shape, color: COLORS[type], x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
}
function collide(p) {
  for (let y = 0; y < p.shape.length; y++) for (let x = 0; x < p.shape[y].length; x++) {
    if (!p.shape[y][x]) continue;
    const bx = p.x + x, by = p.y + y;
    if (bx < 0 || bx >= COLS || by >= ROWS) return true;
    if (by >= 0 && board[by][bx]) return true;
  }
  return false;
}
function rotate(shape) {
  const h = shape.length, w = shape[0].length;
  const res = Array.from({ length: w }, () => Array(h).fill(0));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) res[x][h - 1 - y] = shape[y][x];
  return res;
}
function merge(p) { p.shape.forEach((row, y) => row.forEach((v, x) => { if (v && p.y + y >= 0) board[p.y + y][p.x + x] = p.color; })); }

function clearLines() {
  let cleared = 0;
  for (let y = ROWS - 1; y >= 0; y--) {
    if (board[y].every(c => c)) { board.splice(y, 1); board.unshift(Array(COLS).fill(null)); cleared++; y++; }
  }
  if (cleared) {
    score += [0, 100, 300, 500, 800][cleared] * level;
    lines += cleared; level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(120, 800 - (level - 1) * 70);
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('tetris_high_score', highScore);
      highScoreEl.textContent = highScore;
    }
    updateHUD();
  }
}

function updateHUD() { scoreEl.textContent = score; linesEl.textContent = lines; }

function drawCell(x, y, color, size) {
  const s = size || block, px = x * s, py = y * s;
  ctx.fillStyle = color; ctx.fillRect(px + 1, py + 1, s - 2, s - 2);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(px + 1, py + 1, s - 2, 3);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(px + 1, py + s - 4, s - 2, 3);
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x * block, 0); ctx.lineTo(x * block, H); ctx.stroke(); }
  for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y * block); ctx.lineTo(W, y * block); ctx.stroke(); }
}

function drawGhost() {
  if (!cur) return;
  const ghost = { ...cur, shape: cur.shape };
  while (!collide({ ...ghost, y: ghost.y + 1 })) ghost.y++;
  ghost.shape.forEach((row, y) => row.forEach((v, x) => {
    if (!v) return;
    const px = (ghost.x + x) * block, py = (ghost.y + y) * block;
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.5; ctx.strokeRect(px + 2, py + 2, block - 4, block - 4);
  }));
}

function draw() {
  ctx.clearRect(0, 0, W, H); drawGrid();
  board.forEach((row, y) => row.forEach((c, x) => { if (c) drawCell(x, y, c); }));
  drawGhost();
  if (cur) cur.shape.forEach((row, y) => row.forEach((v, x) => { if (v && cur.y + y >= 0) drawCell(cur.x + x, cur.y + y, cur.color); }));
}
    function spawn() {
    cur = next || newPiece(); next = newPiece();
    if (collide(cur)) {
      gameOver = true; running = false;
      setTimeout(() => {
        alert('游戏结束！\n本次得分：' + score + '\n历史最高：' + highScore);
        startScreen.classList.remove('hidden');
        startBtn.textContent = '🔄 重新开始';
      }, 100);
    }
  }
  
  function step() {
    if (!running || paused || gameOver) return;
    const moved = { ...cur, y: cur.y + 1 };
    if (collide(moved)) { merge(cur); clearLines(); spawn(); } else { cur = moved; }
    draw();
  }
  
  function loop(ts) {
    if (!running) return;
    if (!paused && !gameOver) {
      if (!dropTimer) dropTimer = ts;
      if (ts - dropTimer > dropInterval) { dropTimer = ts; step(); }
    }
    requestAnimationFrame(loop);
  }

  function move(dx) { if (!running || paused || gameOver) return; const p = { ...cur, x: cur.x + dx }; if (!collide(p)) { cur = p; draw(); } }
  function doRotate() { if (!running || paused || gameOver) return; const shape = rotate(cur.shape); for (const off of [0, -1, 1, -2, 2]) { const p = { ...cur, shape, x: cur.x + off }; if (!collide(p)) { cur = p; draw(); return; } } }
  function softDrop() { if (!running || paused || gameOver) return; step(); }
  function hardDrop() { if (!running || paused || gameOver) return; while (!collide({ ...cur, y: cur.y + 1 })) cur.y++; merge(cur); clearLines(); spawn(); draw(); }
  function togglePause() { if (!running || gameOver) return; paused = !paused; }

  function start() {
    board = emptyBoard(); score = 0; lines = 0; level = 1;
    dropInterval = 800; dropTimer = 0; paused = false; gameOver = false; running = true;
    cur = null; next = null; updateHUD();
    startScreen.classList.add('hidden');
    spawn(); draw();
    requestAnimationFrame(loop);
  }

  document.querySelectorAll('.controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'left') move(-1); else if (act === 'right') move(1);
      else if (act === 'rotate') doRotate(); else if (act === 'down') softDrop();
      else if (act === 'drop') hardDrop(); else if (act === 'pause') togglePause();
    });
  });

  document.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft') move(-1); else if (e.key === 'ArrowRight') move(1);
    else if (e.key === 'ArrowUp') doRotate(); else if (e.key === 'ArrowDown') softDrop();
    else if (e.key === ' ') hardDrop(); else if (e.key === 'p' || e.key === 'P') togglePause();
  });

  let touchX = 0, touchY = 0, touchTime = 0;
  canvas.addEventListener('touchstart', e => { const t = e.touches[0]; touchX = t.clientX; touchY = t.clientY; touchTime = Date.now(); }, { passive: true });
  canvas.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - touchX, dy = t.clientY - touchY; const dt = Date.now() - touchTime;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (absX < 20 && absY < 20 && dt < 250) { doRotate(); return; }
    if (absX > absY) { move(dx > 0 ? 1 : -1); }
    else if (dy > 40 && dt < 300) { hardDrop(); }
    else if (dy > 20) { softDrop(); }
  }, { passive: true });

  const musicBtn = document.getElementById('musicBtn');
  musicBtn.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    toggleMusic();
    musicBtn.textContent = isMusicPlaying ? '🔇 暂停音乐' : '🎵 播放音乐';
  });

  // 将“开始”按钮与游戏启动真正绑定（之前崩溃的就是这里）
  startBtn.addEventListener('click', start);

  // 页面加载后先绘制空网格
  board = emptyBoard();
  drawGrid();
})();
</script>
</body>
</html>
